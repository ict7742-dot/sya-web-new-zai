services:
  postgres:
    image: postgres:16-alpine
    container_name: sya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sya
      POSTGRES_PASSWORD: sya
      POSTGRES_DB: sya
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sya -d sya"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
