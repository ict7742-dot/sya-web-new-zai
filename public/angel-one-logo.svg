<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" fill="none">
  <!-- Angel One logo — official brand orange #F4631E + wordmark
       Based on the Angel One visual identity: orange triangular mark
       + "Angel One" wordmark in a bold geometric sans-serif.
       Text uses currentColor so it adapts to light/dark backgrounds. -->
  <g>
    <!-- Brand mark: stylized triangle/arrow representing growth + the "A" in Angel -->
    <path d="M16 4 L4 28 L12 28 L16 20 L20 28 L28 28 Z" fill="#F4631E"/>
    <!-- Inner accent: lighter orange triangle -->
    <path d="M16 12 L12 22 L20 22 Z" fill="#FF8C42"/>
  </g>
  <!-- Wordmark: "Angel One" in bold -->
  <text x="36" y="22" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="currentColor" letter-spacing="-0.3">
    Angel One
  </text>
</svg>
