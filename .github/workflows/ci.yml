name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Create .env from example
        run: cp .env.example .env

      - name: 🗄️ Generate Prisma client
        run: bun run db:generate

      - name: 🧹 Lint
        run: bun run lint

      - name: 🔎 Type-check
        run: bunx tsc --noEmit

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Create .env from example
        run: cp .env.example .env

      - name: 🗄️ Generate Prisma client
        run: bun run db:generate

      - name: 🏗️ Build
        run: bun run build
        env:
          DATABASE_URL: "file:./db/ci-test.db"
          ADMIN_SECRET: "ci-test-secret-not-real"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 3

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔒 Run audit
        run: bun audit || true

      - name: 🔍 Check for committed secrets
        run: |
          if grep -rE "(sk-|AKIA|ghp_|glpat-)" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.env" . 2>/dev/null; then
            echo "⚠️ Potential secrets detected in source files!"
            exit 1
          else
            echo "✅ No secrets detected in source files"
          fi

      - name: 🚫 Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env is tracked by git! This is a security risk."
            exit 1
          else
            echo "✅ .env is not tracked by git"
          fi

      - name: 🚫 Verify database is not tracked
        run: |
          if git ls-files --error-unmatch db/custom.db 2>/dev/null; then
            echo "❌ db/custom.db is tracked by git! Contains user PII."
            exit 1
          else
            echo "✅ db/custom.db is not tracked by git"
          fi
