name: Deploy (Vercel)

on:
  push:
    branches: [main, master]

# Only one deploy at a time per branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded on the same commit
    needs: [quality, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 10
    environment: production

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        # This step will fail gracefully if Vercel secrets aren't configured.
        # Set up the secrets in GitHub repo settings → Secrets and variables → Actions.
        continue-on-error: true

      - name: ℹ️ Deployment info
        run: |
          echo "To enable Vercel auto-deploy:"
          echo "1. Go to https://vercel.com and import this repo"
          echo "2. Add these secrets to your GitHub repo:"
          echo "   - VERCEL_TOKEN"
          echo "   - VERCEL_ORG_ID"
          echo "   - VERCEL_PROJECT_ID"
          echo "3. Push again to trigger deployment"
